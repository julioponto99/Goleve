  notification-service:
    <<: *node-service
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *node-environment
      PORT: "3010"
      MONGO_URI: "mongodb://mongodb:27017/${MONGO_DB_PREFIX:-goleve}_notification"

  ai-coach-service:
    <<: *node-service
    build:
      context: ./backend
      dockerfile: services/ai-coach-service/Dockerfile
    environment:
      <<: *node-environment
      PORT: "3011"
      MONGO_URI: "mongodb://mongodb:27017/${MONGO_DB_PREFIX:-goleve}_ai_coach"

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
  rabbitmq_data:
