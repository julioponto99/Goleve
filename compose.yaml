# Official local-demo stack. Prepare .env and local secrets before starting.
# Existing external volumes remain mandatory. Never use --remove-orphans.
{
  "name": "goleve",
  "services": {
    "mongodb": {
      "image": "mongo:7",
      "restart": "unless-stopped",
      "command": [
        "mongod",
        "--bind_ip_all",
        "--replSet",
        "goleveV1",
        "--wiredTigerCacheSizeGB",
        "0.25"
      ],
      "ports": [
        "127.0.0.1:${MONGO_PORT:-27019}:27017"
      ],
      "volumes": [
        "mongo_data:/data/db"
      ],
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "const h=db.adminCommand({hello:1}); quit(h.setName==='goleveV1'&&h.isWritablePrimary?0:1)"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "30s"
      }
    },
    "mongo-express": {
      "image": "mongo-express:1.0.2-20",
      "profiles": [
        "tools"
      ],
      "restart": "unless-stopped",
      "environment": {
        "ME_CONFIG_MONGODB_URL": "mongodb://mongodb:27017/?replicaSet=goleveV1",
        "ME_CONFIG_MONGODB_ENABLE_ADMIN": "true",
        "ME_CONFIG_BASICAUTH_ENABLED": "true",
        "ME_CONFIG_BASICAUTH_USERNAME": "${MONGO_EXPRESS_USERNAME:?Configure local .env}",
        "ME_CONFIG_BASICAUTH_PASSWORD": "${MONGO_EXPRESS_PASSWORD:?Configure local .env}"
      },
      "ports": [
        "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
      ],
      "networks": [
        "backend"
      ],
      "depends_on": {
        "mongodb": {
          "condition": "service_healthy"
        }
      }
    },
    "rabbitmq": {
      "image": "rabbitmq:3-management",
      "hostname": "rabbitmq",
      "restart": "unless-stopped",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "${RABBITMQ_USER:?Configure root .env}",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:?Configure root .env}"
      },
      "ports": [
        "127.0.0.1:${RABBITMQ_PORT:-5672}:5672",
        "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      ],
      "volumes": [
        "rabbitmq_data:/var/lib/rabbitmq"
      ],
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"
        ],
        "interval": "15s",
        "timeout": "15s",
        "retries": 8,
        "start_period": "40s"
      }
    },
    "api-gateway": {
      "build": {
        "context": "./backend",
        "dockerfile": "api-gateway/Dockerfile"
      },
      "restart": "unless-stopped",
      "init": true,
      "env_file": [
        "./backend/api-gateway/.env"
      ],
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 8,
        "start_period": "30s"
      },
      "depends_on": {
        "auth-service": {
          "condition": "service_healthy"
        },
        "user-service": {
          "condition": "service_healthy"
        },
        "training-service": {
          "condition": "service_healthy"
        },
        "agenda-service": {
          "condition": "service_healthy"
        },
        "performance-service": {
          "condition": "service_healthy"
        },
        "hydration-service": {
          "condition": "service_healthy"
        },
        "professional-service": {
          "condition": "service_healthy"
        },
        "management-service": {
          "condition": "service_healthy"
        },
        "payment-service": {
          "condition": "service_healthy"
        },
        "notification-service": {
          "condition": "service_healthy"
        },
        "ai-coach-service": {
          "condition": "service_healthy"
        }
      },
      "ports": [
        "127.0.0.1:${API_GATEWAY_PORT:-3000}:3000"
      ],
      "secrets": [
        "local_demo_identities"
      ]
    },
    "auth-service": {
