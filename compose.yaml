        "interval": "15s",
        "timeout": "5s",
        "retries": 8,
        "start_period": "30s"
      },
      "depends_on": {
        "mongodb": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "secrets": [
        "mfa",
