name: goleve-mongodb-rs-test

services:
  mongodb-rs-test:
    image: mongo:7
    hostname: mongodb-rs-test
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >-
        cp /run/secrets/mongo_rs_test_key /tmp/mongo_rs_test.key &&
        chmod 400 /tmp/mongo_rs_test.key &&
        chown mongodb:mongodb /tmp/mongo_rs_test.key &&
        exec /usr/local/bin/docker-entrypoint.sh mongod
        --replSet rs0 --bind_ip_all --auth
        --keyFile /tmp/mongo_rs_test.key
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_RS_TEST_ROOT_USERNAME:?Set a fictional test username}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_RS_TEST_ROOT_PASSWORD:?Set a fictional test password outside the repository}"
    ports:
      - "127.0.0.1:27021:27017"
    volumes:
      - goleve_mongodb_rs_test_data:/data/db
    networks:
      - goleve_mongodb_rs_test
    secrets:
      - mongo_rs_test_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1:27017
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  goleve_mongodb_rs_test:
    name: goleve_mongodb_rs_test
    driver: bridge

volumes:
  goleve_mongodb_rs_test_data:
    name: goleve_mongodb_rs_test_data

secrets:
  mongo_rs_test_key:
    file: "${MONGO_RS_TEST_KEY_FILE:?Set a protected fictional keyFile path}"
