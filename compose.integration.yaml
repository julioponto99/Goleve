      "restart": "unless-stopped",
      "init": true,
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=16m"
      ],
      "mem_limit": "128m",
      "pids_limit": 128,
      "environment": {
        "NODE_ENV": "development",
        "PORT": "3000",
        "CORS_ALLOWED_ORIGINS": "http://localhost:5173,http://127.0.0.1:5173",
        "GATEWAY_API_RATE_LIMIT": "300",
        "AUTH_SERVICE_URL": "http://auth-service:3001",
        "USER_SERVICE_URL": "http://user-service:3002",
        "TRAINING_SERVICE_URL": "http://training-service:3003",
        "AGENDA_SERVICE_URL": "http://agenda-service:3004",
        "PERFORMANCE_SERVICE_URL": "http://performance-service:3005",
        "HYDRATION_SERVICE_URL": "http://hydration-service:3006",
        "PROFESSIONAL_SERVICE_URL": "http://professional-service:3007",
        "MANAGEMENT_SERVICE_URL": "http://management-service:3008",
        "PAYMENT_SERVICE_URL": "http://payment-service:3009",
        "NOTIFICATION_SERVICE_URL": "http://notification-service:3010",
        "AI_COACH_SERVICE_URL": "http://ai-coach-service:3011"
      },
      "networks": [
        "backend",
        "edge"
      ],
      "ports": [
        "127.0.0.1:${INTEGRATION_PORT:-64344}:3000"
      ],
      "depends_on": {
        "auth-service": {
          "condition": "service_healthy"
        },
        "user-service": {
          "condition": "service_healthy"
        },
        "training-service": {
          "condition": "service_healthy"
        },
        "agenda-service": {
          "condition": "service_healthy"
        },
        "performance-service": {
          "condition": "service_healthy"
        },
        "hydration-service": {
          "condition": "service_healthy"
        },
        "professional-service": {
          "condition": "service_healthy"
        },
        "management-service": {
          "condition": "service_healthy"
        },
        "payment-service": {
          "condition": "service_healthy"
        },
        "notification-service": {
          "condition": "service_healthy"
        },
        "ai-coach-service": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready',{signal:AbortSignal.timeout(3500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "30s"
      }
    }
  },
  "networks": {
    "backend": {
      "internal": true
    },
    "edge": {}
  },
  "volumes": {
    "mongo_data": {},
    "mongo_config": {},
    "rabbit_data": {}
  },
  "secrets": {
    "replica_key": {
      "file": "${INTEGRATION_ROOT}/replica.key"
    },
    "databases": {
      "file": "${INTEGRATION_ROOT}/databases.json"
    },
    "mfa": {
      "file": "${INTEGRATION_ROOT}/mfa.key"
    },
    "user_key": {
      "file": "${INTEGRATION_ROOT}/user_key.key"
    },
    "agenda_key": {
      "file": "${INTEGRATION_ROOT}/agenda_key.key"
    },
    "management_auth": {
      "file": "${INTEGRATION_ROOT}/management_auth.key"
    },
    "management_professional": {
      "file": "${INTEGRATION_ROOT}/management_professional.key"
    },
    "management_agenda": {
      "file": "${INTEGRATION_ROOT}/management_agenda.key"
    },
    "management_payment": {
      "file": "${INTEGRATION_ROOT}/management_payment.key"
    }
  }
}
