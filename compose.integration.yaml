{
  "name": "${INTEGRATION_PROJECT}",
  "services": {
    "mongodb": {
      "image": "mongo:7",
      "restart": "unless-stopped",
      "init": true,
      "entrypoint": [
        "bash",
        "/integration/mongodb-entrypoint.sh"
      ],
      "env_file": [
        "${INTEGRATION_ROOT}/mongo.env"
      ],
      "environment": {
        "INTEGRATION_INSTANCE": "${INTEGRATION_INSTANCE}"
      },
      "networks": [
        "backend"
      ],
      "mem_limit": "512m",
      "pids_limit": 256,
      "tmpfs": [
        "/run/keys:rw,nosuid,nodev,noexec,size=1m"
      ],
      "volumes": [
        "mongo_data:/data/db",
        "mongo_config:/data/configdb",
        "./scripts/integration:/integration:ro"
      ],
      "secrets": [
        {
          "source": "replica_key",
          "target": "replica-key"
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand({ping:1}).ok?0:1)"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "20s"
      }
    },
    "mongo-init": {
      "image": "mongo:7",
      "init": true,
      "entrypoint": [
        "mongosh",
        "--nodb",
        "--quiet",
        "/integration/mongodb-init.js"
      ],
      "env_file": [
        "${INTEGRATION_ROOT}/mongo.env"
      ],
      "environment": {
        "INTEGRATION_INSTANCE": "${INTEGRATION_INSTANCE}"
      },
      "networks": [
        "backend"
      ],
      "mem_limit": "192m",
      "volumes": [
        "./scripts/integration:/integration:ro"
      ],
      "secrets": [
        {
          "source": "databases",
          "target": "databases.json"
        }
      ],
      "depends_on": {
        "mongodb": {
          "condition": "service_healthy"
        }
      },
      "restart": "no"
    },
    "rabbitmq": {
      "image": "rabbitmq:3-management",
      "hostname": "integration-rabbitmq",
      "restart": "unless-stopped",
      "env_file": [
        "${INTEGRATION_ROOT}/rabbit.env"
      ],
      "networks": [
        "backend"
      ],
      "mem_limit": "384m",
      "volumes": [
        "rabbit_data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "check_running"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 15,
        "start_period": "25s"
      }
    },
    "auth-service": {
      "image": "${INTEGRATION_PROJECT}-auth:local",
      "build": {
        "context": "./backend",
        "dockerfile": "services/auth-service/Dockerfile"
      },
      "restart": "unless-stopped",
      "init": true,
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=16m"
      ],
      "networks": [
        "backend"
      ],
      "mem_limit": "192m",
      "pids_limit": 128,
      "env_file": [
        "${INTEGRATION_ROOT}/auth-service.env"
      ],
      "environment": {
        "NODE_ENV": "development",
        "PORT": "3001",
        "AUTH_SERVICE_URL": "http://auth-service:3001",
        "NODE_OPTIONS": "--max-old-space-size=112",
        "GOLEVE_DEMO_MODE": "disabled",
        "MANAGEMENT_CONTRACT_ENABLED": "true",
        "MANAGEMENT_SERVICE_URL": "http://management-service:3008",
        "MANAGEMENT_AUTH_KEY_FILE": "/run/secrets/management_auth",
        "AUTH_BOOTSTRAP_ENABLED": "false",
        "AUTH_MFA_ENCRYPTION_KEY_FILE": "/run/secrets/mfa"
      },
      "volumes": [
        "./scripts/integration:/integration:ro"
      ],
      "depends_on": {
        "mongo-init": {
          "condition": "service_completed_successfully"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(3500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "30s"
      },
      "secrets": [
        "management_auth",
        "mfa"
      ]
    },
